<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="480" fill="#ffffff"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <text x="40" y="34" font-size="18" font-weight="600" fill="#0f172a">노션 연결 순서</text>

  <!-- lanes -->
  <rect x="45" y="52" width="150" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="120" y="77" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">minutes 앱</text>
  <rect x="255" y="52" width="150" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="330" y="77" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">브라우저</text>
  <rect x="485" y="52" width="150" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="560" y="77" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">노션</text>
  <rect x="715" y="52" width="150" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8"/>
  <text x="790" y="77" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">minutes 서버</text>

  <line x1="120" y1="90" x2="120" y2="440" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="330" y1="90" x2="330" y2="440" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="560" y1="90" x2="560" y2="440" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="790" y1="90" x2="790" y2="440" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 1 -->
  <line x1="120" y1="130" x2="784" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="410" y="112" width="90" height="19" fill="#ffffff"/>
  <text x="455" y="126" font-size="13" fill="#0f172a" text-anchor="middle">① 연결 시작</text>

  <!-- 2 -->
  <line x1="790" y1="170" x2="126" y2="170" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="360" y="152" width="190" height="19" fill="#ffffff"/>
  <text x="455" y="166" font-size="13" fill="#0f172a" text-anchor="middle">② 앱 토큰 + 인가 URL</text>

  <!-- 3 -->
  <line x1="120" y1="210" x2="324" y2="210" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="155" y="192" width="140" height="19" fill="#ffffff"/>
  <text x="225" y="206" font-size="13" fill="#0f172a" text-anchor="middle">③ 인가 페이지 열기</text>

  <!-- 4 -->
  <line x1="330" y1="250" x2="554" y2="250" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="360" y="232" width="165" height="19" fill="#ffffff"/>
  <text x="442" y="246" font-size="13" fill="#0f172a" text-anchor="middle">④ 페이지 선택 후 승인</text>

  <!-- 5 -->
  <line x1="560" y1="290" x2="784" y2="290" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="608" y="272" width="135" height="19" fill="#ffffff"/>
  <text x="675" y="286" font-size="13" fill="#0f172a" text-anchor="middle">⑤ 콜백(code) 전달</text>

  <!-- 6 -->
  <line x1="790" y1="330" x2="336" y2="330" stroke="#3b82f6" stroke-width="2" marker-end="url(#a)"/>
  <rect x="495" y="312" width="130" height="19" fill="#ffffff"/>
  <text x="560" y="326" font-size="13" fill="#0f172a" text-anchor="middle">⑥ 완료 안내 표시</text>

  <!-- 7 -->
  <line x1="126" y1="370" x2="784" y2="370" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="340" y="352" width="230" height="19" fill="#ffffff"/>
  <text x="455" y="366" font-size="13" fill="#475569" text-anchor="middle">⑦ 2초 간격 폴링 (최대 3분)</text>

  <!-- 8 -->
  <rect x="40" y="398" width="330" height="42" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="205" y="425" font-size="14" font-weight="600" fill="#0f172a" text-anchor="middle">⑧ 노션 연결됨 · 워크스페이스명</text>
</svg>
