<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="880" height="330" fill="#ffffff"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="40" y="42" font-size="18" font-weight="600" fill="#0f172a">시작 전 준비물 3가지</text>

  <!-- 1 -->
  <rect x="40" y="70" width="240" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="160" y="105" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">① minutes 앱</text>
  <text x="160" y="132" font-size="13" fill="#475569" text-anchor="middle">배포된 바이너리 설치</text>
  <text x="160" y="154" font-size="13" fill="#475569" text-anchor="middle">또는 직접 빌드</text>

  <!-- 2 -->
  <rect x="320" y="70" width="240" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="440" y="105" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">② 코딩 CLI</text>
  <text x="440" y="132" font-size="13" fill="#475569" text-anchor="middle">claude · codex · gemini</text>
  <text x="440" y="154" font-size="13" fill="#475569" text-anchor="middle">중 1개 설치 + 로그인</text>

  <!-- 3 -->
  <rect x="600" y="70" width="240" height="110" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="720" y="105" font-size="16" font-weight="600" fill="#0f172a" text-anchor="middle">③ 팀 서버 주소</text>
  <text x="720" y="132" font-size="13" fill="#475569" text-anchor="middle">기본값</text>
  <text x="720" y="154" font-size="12" fill="#475569" text-anchor="middle" font-family="ui-monospace, Menlo, monospace">http://localhost:8787</text>

  <line x1="284" y1="125" x2="314" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="564" y1="125" x2="594" y2="125" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="440" y1="184" x2="440" y2="228" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="230" y="234" width="420" height="56" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="440" y="268" font-size="15" font-weight="600" fill="#0f172a" text-anchor="middle">앱 실행 → 노션 연결 → 첫 질문</text>
</svg>
