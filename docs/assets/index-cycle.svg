<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" width="900" height="370" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="370" fill="#ffffff"/>
  <defs>
    <marker id="ic-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="24" y="32" font-size="15" font-weight="700" fill="#0f172a">노션 수정이 검색에 반영되기까지</text>

  <!-- 지름길 안내 -->
  <rect x="250" y="52" width="340" height="60" rx="10" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="270" y="76" font-size="12" fill="#0f172a">앱 헤더의 [재색인] 버튼을 누르면</text>
  <text x="270" y="96" font-size="12" fill="#475569">10분을 기다리지 않고 ③이 바로 시작됩니다</text>
  <line x1="450" y1="112" x2="545" y2="158" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#ic-arrow)"/>

  <!-- 타임라인 -->
  <line x1="60" y1="170" x2="850" y2="170" stroke="#cbd5e1" stroke-width="3"/>
  <circle cx="120" cy="170" r="10" fill="#3b82f6"/>
  <circle cx="340" cy="170" r="10" fill="#f59e0b"/>
  <circle cx="560" cy="170" r="10" fill="#0ea5e9"/>
  <circle cx="770" cy="170" r="10" fill="#10b981"/>

  <!-- 노드 설명 -->
  <rect x="20" y="196" width="200" height="76" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="38" y="222" font-size="13" font-weight="700" fill="#0f172a">① 노션에서 수정</text>
  <text x="38" y="243" font-size="11" fill="#475569">회의록을 고치거나</text>
  <text x="38" y="260" font-size="11" fill="#475569">새로 작성합니다</text>

  <rect x="240" y="196" width="200" height="76" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="258" y="222" font-size="13" font-weight="700" fill="#0f172a">② 최대 10분 대기</text>
  <text x="258" y="243" font-size="11" fill="#475569">서버가 10분 주기로</text>
  <text x="258" y="260" font-size="11" fill="#475569">바뀐 페이지를 확인합니다</text>

  <rect x="460" y="196" width="200" height="76" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="478" y="222" font-size="13" font-weight="700" fill="#0369a1">③ 증분 색인</text>
  <text x="478" y="243" font-size="11" fill="#475569">수정된 페이지만 다시 처리</text>
  <text x="478" y="260" font-size="11" fill="#475569">삭제된 문서는 색인에서 제거</text>

  <rect x="670" y="196" width="200" height="76" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
  <text x="688" y="222" font-size="13" font-weight="700" fill="#0f172a">④ 검색에 반영</text>
  <text x="688" y="243" font-size="11" fill="#475569">새 내용이 답변의</text>
  <text x="688" y="260" font-size="11" fill="#475569">출처로 인용됩니다</text>

  <!-- 연결선 -->
  <line x1="120" y1="196" x2="120" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="340" y1="196" x2="340" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="560" y1="196" x2="560" y2="180" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="770" y1="196" x2="770" y2="180" stroke="#94a3b8" stroke-width="1.2"/>

  <text x="24" y="308" font-size="11.5" fill="#475569">※ 헤더의 색인 상태 숫자는 앱을 켤 때와 재색인이 끝났을 때만 갱신됩니다. 자동으로 다시 조회하지 않습니다.</text>
  <text x="24" y="328" font-size="11.5" fill="#475569">※ 색인 진행률은 표시되지 않고, 실패해도 앱에는 아무 메시지가 뜨지 않습니다.</text>
  <text x="24" y="348" font-size="11.5" fill="#475569">※ 전체 재색인은 앱에서 할 수 없고 서버 운영자만 실행할 수 있습니다.</text>
</svg>
