<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif">
  <rect width="900" height="400" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="32" y="36" font-size="15" font-weight="700" fill="#0f172a">회의록 본문이 지나가는 경로</text>
  <text x="32" y="58" font-size="12.5" fill="#475569">주황색 화살표는 회의록 내용이 외부 서비스로 나가는 구간입니다.</text>

  <!-- 색인 경로 -->
  <text x="32" y="100" font-size="13" font-weight="700" fill="#0369a1">① 색인 (10분마다 자동)</text>

  <rect x="32" y="112" width="160" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="52" y="140" font-size="13.5" font-weight="700" fill="#0f172a">노션</text>
  <text x="52" y="160" font-size="12" fill="#475569">공유한 페이지만</text>

  <rect x="272" y="112" width="180" height="62" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="292" y="140" font-size="13.5" font-weight="700" fill="#0369a1">팀 서버</text>
  <text x="292" y="160" font-size="12" fill="#475569">본문·벡터를 보관</text>

  <rect x="560" y="112" width="300" height="62" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="140" font-size="13.5" font-weight="700" fill="#b45309">Google Gemini 임베딩 API</text>
  <text x="580" y="160" font-size="12" fill="#92400e">무료 티어 — 학습·검토에 쓰일 수 있음</text>

  <line x1="192" y1="143" x2="268" y2="143" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>
  <line x1="452" y1="143" x2="556" y2="143" stroke="#f59e0b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="196" y="134" font-size="11.5" fill="#475569">본문 읽기</text>
  <text x="458" y="134" font-size="11.5" fill="#b45309">조각 본문 전송</text>

  <!-- 질문 경로 -->
  <text x="32" y="238" font-size="13" font-weight="700" fill="#0369a1">② 질문할 때</text>

  <rect x="32" y="250" width="160" height="72" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="52" y="278" font-size="13.5" font-weight="700" fill="#1d4ed8">내 앱</text>
  <text x="52" y="298" font-size="12" fill="#475569">질문 입력</text>
  <text x="52" y="315" font-size="12" fill="#475569">답변·출처 표시</text>

  <rect x="272" y="250" width="180" height="72" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="292" y="278" font-size="13.5" font-weight="700" fill="#0369a1">팀 서버 (검색)</text>
  <text x="292" y="298" font-size="12" fill="#475569">관련 조각 8개를</text>
  <text x="292" y="315" font-size="12" fill="#475569">골라서 돌려줌</text>

  <rect x="560" y="250" width="300" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="580" y="278" font-size="13.5" font-weight="700" fill="#b45309">내 PC의 코딩 CLI → 공급자 API</text>
  <text x="580" y="298" font-size="12" fill="#92400e">claude / codex / gemini 중 설치한 것</text>
  <text x="580" y="315" font-size="12" fill="#92400e">질문 + 조각 8개 본문이 전송됨</text>

  <line x1="192" y1="272" x2="268" y2="272" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="196" y="263" font-size="11.5" fill="#475569">질문</text>
  <line x1="268" y1="300" x2="196" y2="300" stroke="#64748b" stroke-width="1.6" marker-end="url(#a1)"/>
  <text x="200" y="316" font-size="11.5" fill="#475569">조각 + 링크</text>

  <line x1="192" y1="340" x2="556" y2="340" stroke="#f59e0b" stroke-width="2" marker-end="url(#a2)"/>
  <text x="300" y="332" font-size="11.5" fill="#b45309">답변 생성 요청 (질문 + 회의록 조각 본문)</text>

  <text x="32" y="382" font-size="12" fill="#475569">대화 내용은 어디에도 저장되지 않습니다. 앱을 끄면 사라집니다.</text>
</svg>
