<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="720" height="600" fill="#ffffff"/>
  <defs>
    <marker id="qf-arrow" markerWidth="10" markerHeight="10" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <text x="32" y="30" font-size="15" font-weight="700" fill="#0f172a">질문 한 건이 처리되는 흐름</text>
  <text x="32" y="66" font-size="12" font-weight="700" fill="#475569">앱 안에서 일어나는 일</text>
  <text x="432" y="66" font-size="12" font-weight="700" fill="#475569">그때 화면에 뜨는 문구</text>

  <!-- 1 -->
  <rect x="32" y="84" width="378" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="52" y="110" font-size="13.5" font-weight="700" fill="#1d4ed8">① 질문 정리</text>
  <text x="52" y="130" font-size="11.5" fill="#475569">앞선 대화를 참고해 대명사를 풀어 씁니다</text>
  <text x="52" y="147" font-size="11.5" fill="#475569">첫 질문이면 이 단계를 건너뜁니다</text>
  <rect x="432" y="84" width="256" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="452" y="125" font-size="12" fill="#0f172a">질문을 정리하고 있어요</text>
  <line x1="221" y1="154" x2="221" y2="176" stroke="#64748b" stroke-width="1.6" marker-end="url(#qf-arrow)"/>

  <!-- 2 -->
  <rect x="32" y="178" width="378" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="52" y="204" font-size="13.5" font-weight="700" fill="#1d4ed8">② 회의록 검색</text>
  <text x="52" y="224" font-size="11.5" fill="#475569">서버에 질문을 보내 관련된 회의록 조각을</text>
  <text x="52" y="241" font-size="11.5" fill="#475569">최대 8개까지 받아옵니다</text>
  <rect x="432" y="178" width="256" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="452" y="219" font-size="12" fill="#0f172a">회의록을 검색하고 있어요</text>
  <line x1="221" y1="248" x2="221" y2="270" stroke="#64748b" stroke-width="1.6" marker-end="url(#qf-arrow)"/>

  <!-- 3 -->
  <rect x="32" y="272" width="378" height="70" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="52" y="298" font-size="13.5" font-weight="700" fill="#1d4ed8">③ 답변 생성</text>
  <text x="52" y="318" font-size="11.5" fill="#475569">받아온 조각으로 프롬프트를 만들어</text>
  <text x="52" y="335" font-size="11.5" fill="#475569">내 컴퓨터의 코딩 CLI가 답변을 씁니다</text>
  <rect x="432" y="272" width="256" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="452" y="304" font-size="12" fill="#0f172a">회의록 N건을 참고해</text>
  <text x="452" y="323" font-size="12" fill="#0f172a">답변을 작성하고 있어요</text>
  <line x1="221" y1="342" x2="221" y2="364" stroke="#64748b" stroke-width="1.6" marker-end="url(#qf-arrow)"/>

  <!-- 4 -->
  <rect x="32" y="366" width="378" height="70" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <text x="52" y="392" font-size="13.5" font-weight="700" fill="#0369a1">④ 스트리밍 표시</text>
  <text x="52" y="412" font-size="11.5" fill="#475569">글자가 만들어지는 대로 말풍선에</text>
  <text x="52" y="429" font-size="11.5" fill="#475569">실시간으로 채워집니다</text>
  <rect x="432" y="366" width="256" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="452" y="398" font-size="12" fill="#0f172a">대기 문구가 사라지고</text>
  <text x="452" y="417" font-size="12" fill="#0f172a">답변 본문이 보이기 시작</text>
  <line x1="221" y1="436" x2="221" y2="458" stroke="#64748b" stroke-width="1.6" marker-end="url(#qf-arrow)"/>

  <!-- 5 -->
  <rect x="32" y="460" width="378" height="70" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
  <text x="52" y="486" font-size="13.5" font-weight="700" fill="#0f172a">⑤ 출처 카드</text>
  <text x="52" y="506" font-size="11.5" fill="#475569">답변이 실제로 인용한 문서만 골라</text>
  <text x="52" y="523" font-size="11.5" fill="#475569">답변 아래에 카드로 붙습니다</text>
  <rect x="432" y="460" width="256" height="70" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="452" y="492" font-size="12" fill="#0f172a">[출처 1] 문서 제목</text>
  <text x="452" y="511" font-size="11.5" fill="#475569">헤딩 &gt; 경로 &gt; 표시</text>

  <text x="32" y="562" font-size="11.5" fill="#475569">※ ①~③ 동안에는 위 문구와 점 3개 애니메이션만 보입니다. 답변 첫 글자가 나오면 문구는 사라집니다.</text>
  <text x="32" y="582" font-size="11.5" fill="#475569">※ ①은 대화 이력이 있을 때만 실행되므로, 후속 질문은 첫 질문보다 답이 늦게 시작됩니다.</text>
</svg>
